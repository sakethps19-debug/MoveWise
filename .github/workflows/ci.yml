name: CI

on:
  push:
    branches: [main]
  pull_request:

# Closes the top item in docs/known-risks.md ("No CI. Every verification
# gate is run manually. Nothing stops a regression from merging.") — this
# runs exactly the sequence that was run manually before every commit
# throughout this project's history: install, typecheck, unit tests,
# content validation, then a real production build.
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # One absolute path, shared by every step regardless of its working
      # directory — avoids the apps/web-vs-packages/db relative-path
      # distinction documented in docs/architecture.md, which only exists
      # to keep local dev's two .env files portable across clone locations.
      DATABASE_URL: file:${{ github.workspace }}/packages/db/dev-ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # packages/db's own typecheck imports its generated Prisma client
      # (packages/db/src/generated/), which doesn't exist until `prisma
      # generate` runs — normally triggered by apps/web's predev/prebuild,
      # but `pnpm typecheck` below runs standalone `tsc` per package and
      # never goes through that chain. Generate it explicitly, first.
      - run: npx prisma generate
        working-directory: packages/db

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm validate:content

      - name: Build apps/web (also runs prisma generate/db push again, via predev/prebuild)
        run: pnpm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    env:
      DATABASE_URL: file:${{ github.workspace }}/packages/db/dev-ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright's browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite (auto-starts the dev server per playwright.config.ts)
        working-directory: apps/web
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
