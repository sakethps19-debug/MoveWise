name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a manual run be started from the GitHub Actions tab (or the
  # `gh workflow run` CLI) without needing a new commit or PR — the
  # primary way to trigger CI on demand from a browser (see
  # docs/e2e-testing.md). `suite: smoke` runs only the @smoke-tagged
  # subset (apps/web/package.json's test:e2e:smoke) for a fast check;
  # `full` (the default) runs everything test:e2e does.
  workflow_dispatch:
    inputs:
      suite:
        description: "E2E suite to run"
        type: choice
        default: full
        options:
          - full
          - smoke

# Closes the top item in docs/known-risks.md ("No CI. Every verification
# gate is run manually. Nothing stops a regression from merging.") — this
# runs exactly the sequence that was run manually before every commit
# throughout this project's history: install, typecheck, unit tests,
# content validation, then a real production build.
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      # Real Postgres, not SQLite — the app targets Supabase Postgres in
      # dev/prod (see ADR-0005); CI gets its own throwaway instance per
      # run rather than touching the real Supabase project, same as
      # local dev uses its own local Postgres instance.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: movewise
          POSTGRES_PASSWORD: movewise_ci
          POSTGRES_DB: movewise_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://movewise:movewise_ci@localhost:5432/movewise_ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # packages/db's own typecheck imports its generated Prisma client
      # (packages/db/src/generated/), which doesn't exist until `prisma
      # generate` runs — normally triggered by apps/web's predev/prebuild,
      # but `pnpm typecheck` below runs standalone `tsc` per package and
      # never goes through that chain. Generate it explicitly, first.
      # (`generate` reads only schema.prisma, no live DB connection needed.)
      - run: npx prisma generate
        working-directory: packages/db

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm validate:content

      - name: Build apps/web (also runs prisma generate/migrate deploy again, via predev/prebuild)
        run: pnpm run build

      # RLS regression check (docs/security-checklist.md) — runs after
      # the build above, since that's what actually applies every
      # migration (via predev/prebuild's `prisma migrate deploy`) against
      # this job's own throwaway Postgres. Confirmed real gap this
      # guards against: nine tables added after the first RLS migration
      # silently shipped with RLS disabled, caught only by hand later via
      # Supabase's Security Advisor — this makes that a build failure
      # instead of a silent drift.
      - name: Check RLS is enabled on every public table
        run: pnpm --filter @movewise/db db:check-rls

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: movewise
          POSTGRES_PASSWORD: movewise_ci
          POSTGRES_DB: movewise_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://movewise:movewise_ci@localhost:5432/movewise_ci
      # The full suite performs ~20 real signups across its spec files —
      # right at production's own 20/hour-per-IP anti-abuse limit (see
      # apps/web/app/actions.ts's SIGNUP_LIMIT) — and every request in
      # this job comes from the single runner IP, so the suite's own
      # traffic collides with its own budget. Doesn't touch production's
      # tuning, which stays at its default whenever this var is unset.
      SIGNUP_RATE_LIMIT: "200"
      # Same reasoning as SIGNUP_RATE_LIMIT above, for the suite's own
      # real /login submissions against LOGIN_IP_LIMIT/LOGIN_EMAIL_LIMIT.
      LOGIN_RATE_LIMIT: "200"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Playwright browsers live outside node_modules (~/.cache/ms-playwright),
      # so pnpm/action-setup's own cache doesn't cover them. Keyed on the
      # exact @playwright/test version (from the lockfile) so a version bump
      # naturally invalidates it instead of silently reusing a stale browser.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright's browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # A cache hit skips the download above but not Playwright's own
      # system dependencies (fonts, codecs) — those are OS packages, not
      # part of the cached browser directory, so install them separately
      # every run; this is fast when they're already present.
      - name: Install Playwright's OS dependencies
        working-directory: apps/web
        run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Run E2E suite (auto-starts the dev server per playwright.config.ts)
        working-directory: apps/web
        run: npx playwright test ${{ github.event.inputs.suite == 'smoke' && '--grep @smoke' || '' }}

      # Always uploaded, not just on failure: Step 5's screenshots (for
      # manual/AI review of what the app actually looked like) and the
      # trace viewer both live in this report even on an all-green run,
      # and docs/e2e-testing.md tells the user to open this from the
      # Actions run summary — that link should exist whether or not
      # anything failed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30

      # Raw per-test traces/videos/screenshots (playwright-report/ embeds
      # what it needs for the HTML report, but the unprocessed
      # attachments — full-resolution video, individual failure
      # screenshots — live here). Only worth keeping on failure; a green
      # run has nothing in here worth the storage.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: apps/web/test-results/
          retention-days: 30

  perf:
    runs-on: ubuntu-latest
    needs: verify
    # Skipped on a manual `smoke` dispatch run — this job takes ~40s on
    # top of a full production build and exists to catch a route falling
    # over or degrading badly, not something the fast smoke check needs.
    if: github.event.inputs.suite != 'smoke'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: movewise
          POSTGRES_PASSWORD: movewise_ci
          POSTGRES_DB: movewise_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://movewise:movewise_ci@localhost:5432/movewise_ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A real production build, not `next dev` — apps/web/e2e/performance.spec.ts
      # already covers dev-mode timing as part of the main E2E suite;
      # this job's whole point is meaningful throughput/latency numbers,
      # which `next dev`'s on-demand compilation makes impossible to get.
      - name: Build apps/web (also runs prisma generate/migrate deploy via prebuild)
        run: pnpm --filter @movewise/web build

      - name: Start production server
        working-directory: apps/web
        run: |
          nohup pnpm start > /tmp/movewise-perf-server.log 2>&1 &
          echo "Waiting for http://localhost:3000 ..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Server is up."
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in time. Log:"
          cat /tmp/movewise-perf-server.log
          exit 1

      - name: Run load/performance smoke check
        working-directory: apps/web
        run: pnpm test:perf:smoke

      - name: Server log (always, for context on the numbers above)
        if: always()
        run: cat /tmp/movewise-perf-server.log || true
